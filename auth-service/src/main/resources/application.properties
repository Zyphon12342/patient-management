spring.application.name=auth-service
server.port=4005

spring.config.import=aws-secretsmanager:prod/auth-service/config;aws-secretsmanager:prod/auth-service/db
spring.datasource.url=jdbc:postgresql://${RDS_ENDPOINT}:5432/db
spring.datasource.username=${prod/auth-service/db.username}
spring.datasource.password=${prod/auth-service/db.password}
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.cloud.aws.region.static=ap-south-1

# Alias so JwtUtil @Value("${jwt.secret}") resolves the secret manager key jwt_secret
jwt.secret=${jwt_secret}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never